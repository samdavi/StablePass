# Pipeline: Build and Publish Docker Image
# Context: Triggers on new GitHub Release publication to build multi-arch images.
name: Build and Publish Docker Image

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable QEMU for ARM64 emulation on AMD64 runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Initialize Buildx for multi-platform build capabilities
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push multi-arch manifest (AMD64/ARM64) with semantic version tags
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            secbysam/stablepass:${{ github.ref_name }}
            secbysam/stablepass:latest
