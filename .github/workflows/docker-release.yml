# GitHub Actions Workflow: Build and Publish Docker Image
# This workflow automates the building and publishing of Docker images for StablePass.
# It triggers only when a new GitHub Release is published, ensuring stable versions are containerized.
#
# What happens:
# 1. Triggers on release publication (manual or automated releases).
# 2. Checks out the repository code.
# 3. Sets up QEMU for ARM64 emulation (allows building for multiple architectures on AMD64 runners).
# 4. Initializes Docker Buildx for advanced multi-platform builds.
# 5. Logs into Docker Hub using stored secrets (DOCKER_USERNAME and DOCKER_PASSWORD).
# 6. Builds and pushes multi-architecture images (AMD64 and ARM64) to Docker Hub.
# 7. Tags images with the release version (e.g., v1.0.0) and 'latest'.
#
# Result: After a release, the Docker image is available on Docker Hub as secbysam/stablepass:latest and secbysam/stablepass:<version>.
# This image can then be deployed to platforms like Render, which pulls from Docker Hub.

name: Build and Publish Docker Image

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable QEMU for ARM64 emulation on AMD64 runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Initialize Buildx for multi-platform build capabilities
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push multi-arch manifest (AMD64/ARM64) with semantic version tags
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            secbysam/stablepass:${{ github.ref_name }}
            secbysam/stablepass:latest
